<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>调距机构 - Y形摆 · 鲍迪奇摆 · 三维仿真动画</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
<nav class="topnav">
<a class="back" href="index.html">&#8592; HOME</a>
</nav>
<header class="page-head">
<h1>调距机构</h1>
<p class="sub">一根同轴左右旋丝杆，两个黄铜法兰反向走</p>
<p class="intro">转 n 圈，两个挂点各走 p·n，间距改变 2pn；100 格分度盘每格 0.02 mm。</p>
</header>
<section class="grid clips">
<article class="card clip-card">
  <div class="player">
    <video src="video/g1_leadscrew.mp4" poster="video/g1_leadscrew.jpg" autoplay muted loop playsinline preload="metadata"></video>
    <button class="fs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V5h5M15 5h5v5M20 15v4h-5M9 19H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="placeholder">
      <p class="placeholder-label">MEDIA NOT FOUND</p>
      <p class="placeholder-note">转数 → 间距增量，中点保持不动</p>
    </div>
  </div>
  <div class="clip-text">
    <h3>双向丝杆三维剖解</h3>
    <p>转数 → 间距增量，中点保持不动</p>
  </div>
</article>
<article class="card clip-card">
  <div class="player">
    <video src="video/g2_readout.mp4" poster="video/g2_readout.jpg" autoplay muted loop playsinline preload="metadata"></video>
    <button class="fs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V5h5M15 5h5v5M20 15v4h-5M9 19H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="placeholder">
      <p class="placeholder-label">MEDIA NOT FOUND</p>
      <p class="placeholder-note">尺身与读数头各随一个滑座，直接读间距差</p>
    </div>
  </div>
  <div class="clip-text">
    <h3>相对读数标尺</h3>
    <p>尺身与读数头各随一个滑座，直接读间距差</p>
  </div>
</article>
</section>
<footer class="site-footer"><p>Y形摆 · 鲍迪奇摆 · 三维仿真动画 &middot; CUPT 2027 Problem 5</p></footer>
</main>


<script>
(function () {
  "use strict";
  function markMissing(card) {
    if (card) { card.classList.add("missing"); }
  }
  var cards = document.querySelectorAll(".card");
  cards.forEach(function (card) {
    var video = card.querySelector("video");
    if (!video) { return; }
    video.addEventListener("error", function () { markMissing(card); });
    var posterUrl = video.getAttribute("poster");
    if (posterUrl) {
      var probe = new Image();
      probe.addEventListener("error", function () { markMissing(card); });
      probe.src = posterUrl;
    }
    window.setTimeout(function () {
      if (video.readyState === 0) { markMissing(card); }
    }, 4000);
  });
  var buttons = document.querySelectorAll(".fs");
  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var card = btn.closest(".card");
      var video = card ? card.querySelector("video") : null;
      if (!video) { return; }
      try {
        if (typeof video.requestFullscreen === "function") {
          var pending = video.requestFullscreen();
          if (pending && typeof pending.catch === "function") {
            pending.catch(function () { return; });
          }
        } else if (typeof video.webkitEnterFullscreen === "function") {
          video.webkitEnterFullscreen();
        }
      } catch (err) {
        return;
      }
    });
  });
})();
</script>
</body>
</html>

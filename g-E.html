<header class="page-head">

<p class="intro">各向同性阻尼只缩不改形；各向异性会把绸带挤成斜线；平方阻尼先快后慢。</p>
<button class="playall" id="playall" type="button" hidden>TAP TO PLAY ALL / 全部播放</button>

<section class="grid clips">
<article class="card clip-card">
  <div class="player">
    <video src="video/e1_damping.mp4" poster="video/e1_damping.jpg" autoplay muted loop playsinline preload="metadata"></video>
    <button class="fs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V5h5M15 5h5v5M20 15v4h-5M9 19H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="placeholder">
      <p class="placeholder-label">MEDIA NOT FOUND</p>
      <p class="placeholder-note">各向同性 / 各向异性 / 平方阻尼</p>
    </div>
  </div>
  <div class="clip-text">
    <h3>三种阻尼对比</h3>
    <p>各向同性 / 各向异性 / 平方阻尼</p>
  </div>
</article>
<article class="card clip-card">
  <div class="player">
    <video src="video/e2_qfactor.mp4" poster="video/e2_qfactor.jpg" autoplay muted loop playsinline preload="metadata"></video>
    <button class="fs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 9V5h5M15 5h5v5M20 15v4h-5M9 19H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>

<footer class="site-footer"><p>Y形摆 · 鲍迪奇摆 · 三维仿真动画 &middot; CUPT 2027 Problem 5</p></footer>
</main>


<script>
(function () {
  "use strict";
  function markMissing(card) {
    if (card) { card.classList.add("missing"); }
  }
  var cards = document.querySelectorAll(".card");
  cards.forEach(function (card) {
    var video = card.querySelector("video");
    if (!video) { return; }
    video.addEventListener("error", function () { markMissing(card); });
    var posterUrl = video.getAttribute("poster");
    if (posterUrl) {
      var probe = new Image();
      probe.addEventListener("error", function () { markMissing(card); });
      probe.src = posterUrl;
    }
    window.setTimeout(function () {
      if (video.readyState === 0) { markMissing(card); }
    }, 4000);
  });
  var buttons = document.querySelectorAll(".fs");
  buttons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      var card = btn.closest(".card");
      var video = card ? card.querySelector("video") : null;
      if (!video) { return; }
      try {
        if (typeof video.requestFullscreen === "function") {
          var pending = video.requestFullscreen();
          if (pending && typeof pending.catch === "function") {
            pending.catch(function () { return; });
          }
        } else if (typeof video.webkitEnterFullscreen === "function") {
          video.webkitEnterFullscreen();
        }
      } catch (err) {
        return;
      }
    });
  });
  // Some in-app browsers (WeChat / X5) block autoplay; one tap restarts all.
  function playAll() {
    document.querySelectorAll("video").forEach(function (v) {
      v.muted = true;
      v.loop = true;
      try {
        var p = v.play();
        if (p && typeof p.catch === "function") { p.catch(function () {}); }
      } catch (err) { /* ignore */ }
    });
  }
  var allBtn = document.getElementById("playall");
  if (allBtn) {
    allBtn.addEventListener("click", function () {
      playAll();
      allBtn.classList.add("done");
    });
  }
  window.setTimeout(function () {
    var paused = 0;
    document.querySelectorAll("video").forEach(function (v) {
      if (v.paused) { paused += 1; }
    });
    if (paused > 0 && allBtn) { allBtn.hidden = false; }
  }, 2500);
})();
</script>
</body>
</html>
